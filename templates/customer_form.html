{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'Add' }} Customer{% endblock %}
{% block content %}

<h4 class="mb-3">{{ 'Edit' if customer else 'Add' }} Customer</h4>

<div class="card-soft p-3 p-lg-4">
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Customer Name *</label>
      <input type="text" name="name" class="form-control form-control-lg" value="{{ customer.name if customer else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Mobile Number *</label>
      <input type="tel" name="mobile" class="form-control form-control-lg" value="{{ customer.mobile if customer else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" rows="2">{{ customer.address if customer else '' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Notes</label>
      <textarea name="notes" class="form-control" rows="2">{{ customer.notes if customer else '' }}</textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-theme touch-btn flex-fill">Save Customer</button>
      <a href="{{ url_for('main.customers_list') }}" class="btn btn-outline-secondary touch-btn">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
