{% extends "base.html" %}
{% block title %}Reports - {{ settings.shop_name }}{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Reports</h4>
  <select id="periodSelect" class="form-select w-auto">
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="monthly" selected>Monthly</option>
    <option value="yearly">Yearly</option>
  </select>
</div>

<div class="row g-3 mb-3" id="summaryCards">
  <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">Income</div><div class="stat-value" id="rIncome">₹0</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value" id="rTotal">0</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" id="rCompleted">0</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-label">Overdue</div><div class="stat-value" id="rOverdue">0</div></div></div>
</div>

<div class="row g-3">
  <div class="col-lg-7">
    <div class="card-soft p-3">
      <h6 class="text-theme">Income Trend</h6>
      <canvas id="incomeChart" height="180"></canvas>
    </div>
  </div>
  <div class="col-lg-5">
    <div class="card-soft p-3">
      <h6 class="text-theme">Orders by Status</h6>
      <canvas id="statusChart" height="180"></canvas>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
let incomeChart, statusChart;

async function loadReport(period) {
  const res = await fetch(`/api/reports/data?period=${period}`);
  const data = await res.json();

  document.getElementById('rIncome').textContent = '₹' + Math.round(data.total_income);
  document.getElementById('rTotal').textContent = data.total_orders;
  document.getElementById('rCompleted').textContent = data.completed_orders;
  document.getElementById('rOverdue').textContent = data.overdue_orders;

  const incomeCtx = document.getElementById('incomeChart');
  if (incomeChart) incomeChart.destroy();
  incomeChart = new Chart(incomeCtx, {
    type: 'line',
    data: {
      labels: data.chart_labels,
      datasets: [{ label: 'Income (₹)', data: data.chart_values, borderColor: '#6b4226', backgroundColor: 'rgba(107,66,38,0.1)', fill: true, tension: 0.3 }]
    },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });

  const statusCtx = document.getElementById('statusChart');
  if (statusChart) statusChart.destroy();
  statusChart = new Chart(statusCtx, {
    type: 'doughnut',
    data: {
      labels: data.status_labels,
      datasets: [{ data: data.status_values, backgroundColor: ['#e7e9ee','#e0e7ff','#fef3c7','#fde68a','#dbeafe','#d1fae5','#dcfce7'] }]
    },
    options: { responsive: true }
  });
}

document.getElementById('periodSelect').addEventListener('change', (e) => loadReport(e.target.value));
loadReport('monthly');
</script>
{% endblock %}
