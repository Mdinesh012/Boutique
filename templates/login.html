{% extends "base.html" %}
{% block title %}Login - {{ settings.shop_name }}{% endblock %}
{% block auth_content %}
<div class="login-wrapper">
  <div class="login-card">
    {% if settings.logo_path %}
      <img src="{{ url_for('static', filename='uploads/' + settings.logo_path) }}" class="login-logo" alt="Logo">
    {% else %}
      <div class="login-logo-placeholder"><i class="bi bi-scissors"></i></div>
    {% endif %}
    <h1>{{ settings.shop_name }}</h1>
    <p class="text-muted mb-4">Tailoring Order Management</p>
    <form method="POST">
      <div class="mb-3 text-start">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control form-control-lg" required autofocus>
      </div>
      <div class="mb-3 text-start">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control form-control-lg" required>
      </div>
      <button type="submit" class="btn btn-theme btn-lg w-100 mt-2">Login</button>
    </form>
    <p class="text-muted small mt-3">Default: admin / admin123</p>
  </div>
</div>
{% endblock %}
